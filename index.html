<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure WiFi Password Viewer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4f46e5,#06b6d4);
overflow:hidden;
}

.card{
width:360px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
padding:30px;
border-radius:22px;
box-shadow:0 15px 35px rgba(0,0,0,.35);
color:#fff;
animation:fade .5s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:13px;
border:none;
outline:none;
border-radius:12px;
margin-top:8px;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:18px;
border:none;
border-radius:12px;
background:#fff;
color:#2563eb;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

#error{
color:#ffb4b4;
margin-top:10px;
text-align:center;
font-size:14px;
}

#viewer{
display:none;
}

.passwordBox{
position:relative;
}

.passwordBox input{
padding-right:85px;
}

.toggle{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:14px;
font-weight:600;
color:#2563eb;
}

.info{
margin-top:15px;
font-size:14px;
line-height:1.8;
}
</style>
</head>

<body>

<div class="card" id="login">

<h2>🔐 Secure Login</h2>

<input type="password" id="loginPass" placeholder="Enter Security Password">

<button onclick="login()">Unlock</button>

<div id="error"></div>

</div>

<div class="card" id="viewer">

<h2>📶 WiFi Details</h2>

<div class="info">
<b>WiFi Name</b><br>
nawnit_5
</div>

<div class="info">
<b>WiFi Password</b>
</div>

<div class="passwordBox">

<input type="password" id="wifiPass" value="@Pandey_0011" readonly>

<span class="toggle" onclick="togglePass()">Show</span>

</div>

<button onclick="copyPass()">📋 Copy Password</button>

</div>

<script>

const SECURITY_PASSWORD="Admin@123";

function login(){

let pass=document.getElementById("loginPass").value;

if(pass===SECURITY_PASSWORD){

document.getElementById("login").style.display="none";
document.getElementById("viewer").style.display="block";

}else{

document.getElementById("error").innerHTML="❌ Incorrect security password.";

}

}

function togglePass(){

let p=document.getElementById("wifiPass");
let t=document.querySelector(".toggle");

if(p.type==="password"){
p.type="text";
t.innerHTML="Hide";
}else{
p.type="password";
t.innerHTML="Show";
}

}

function copyPass(){

navigator.clipboard.writeText(document.getElementById("wifiPass").value);

alert("WiFi password copied!");

}

</script>

</body>
</html>
